# Temporary staging Blueprint. It is not a production/SaaS approval.
# The free database expires after 30 days; never store real customer data here.
services:
  - type: web
    name: enterprise-gtm-ai-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: GOOGLE_AUTH_REQUIRED
        value: "true"
      - key: FRONTEND_URL
        value: https://enterprise-gtm-ai-staging.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://enterprise-gtm-ai-staging.onrender.com/auth/google/callback
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-gtm-ai-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: enterprise-gtm-ai-staging-db
    databaseName: enterprise_gtm_ai
    plan: free
